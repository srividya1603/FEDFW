<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventEase</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="main"><h1>👥 <span id="lbl">Guests</span></h1><div class="row"><select id="sel" onchange="draw()"></select><input id="q" placeholder="Search..." oninput="draw()"><button class="btn" onclick="addG()">+ Add Guest</button></div><div class="grid" id="stt"></div><div class="card scroll" style="margin-top:16px" id="tb"></div></div>
<script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/events.js"></script>
<script>
if(shell("guests.html")){const ST=["Pending","Invited","Confirmed","Maybe","Declined"];sel.innerHTML=getData("events").map(e=>`<option value="${e.id}">${e.name}</option>`).join("");
window.draw=function(){const id=+sel.value,all=getData("guests").filter(g=>g.eventId==id),L=all.filter(g=>(g.name+g.email).toLowerCase().includes(q.value.toLowerCase()));lbl.textContent=evOf(id).mode=="personal"?"Guests":"Attendees";
stt.innerHTML=[["Total",all.length],...ST.slice(1).map(s=>[s,all.filter(g=>g.status==s).length])].map(s=>`<div class="card stat"><b>${s[1]}</b><span>${s[0]}</span><div class="bar"><i style="width:${all.length?s[1]/all.length*100:0}%"></i></div></div>`).join("");
tb.innerHTML=L.length?"<table><tr><th>Name<th>Email<th>Phone<th>Status<th>Actions</tr>"+L.map(g=>`<tr><td>${g.name}<td>${g.email}<td>${g.phone||"-"}<td><select onchange="updateData('guests',${g.id},{status:this.value});draw()">${ST.map(s=>`<option ${s==g.status?"selected":""}>${s}</option>`).join("")}</select><td><button class="btn o" onclick="toast('Reminder sent to ${g.name}','inf')">Remind</button> <button class="btn d" onclick="confirmBox('Delete guest?',()=>{deleteData('guests',${g.id});draw()})">Delete</button>`).join("")+"</table>":"<p>🎉 No guests yet. Add your first guest!</p>"};
window.addG=()=>{modal(`<h2>Add Guest</h2><input id="gn" placeholder="Name"><input id="ge" placeholder="Email"><input id="gp" placeholder="Phone"><div class="err-t" id="er"></div><button class="btn" onclick="svG()">Add &amp; Generate Invitation</button>`)};
window.svG=()=>{if(!gn.value.trim())return er.textContent="Name required";if(!/^\S+@\S+\.\S+$/.test(ge.value))return er.textContent="Valid email required";saveData("guests",[...getData("guests"),{id:Date.now(),eventId:+sel.value,name:gn.value,email:ge.value,phone:gp.value,status:"Invited"}]);closeModal();toast("Guest added, invitation generated");draw()};draw()}
</script></body></html>
