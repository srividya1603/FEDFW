<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventEase — Create</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="main"><h1>Create Event</h1><div class="card" style="max-width:560px"><input id="n" placeholder="Event name"><select id="cat"><option>Wedding</option><option>Birthday</option><option>Engagement</option><option>Baby Shower</option><option>Housewarming</option><option>Reunion</option><option>Networking</option><option>Conference</option><option>Workshop</option><option>Concert</option><option>Corporate</option><option>Community</option><option>Other</option></select><label><input type="checkbox" id="ol" style="width:auto"> Online event</label><textarea id="d" placeholder="Description"></textarea><input id="dt" type="date"><input id="v" placeholder="Venue"><input id="ci" placeholder="City"><input id="cp" type="number" placeholder="Max capacity"><input id="pr" type="number" placeholder="Ticket price"><div class="err-t" id="er"></div><button class="btn" onclick="mk()">Create Event</button></div></div>
<script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/events.js"></script><script>
if(shell("create-event.html")){window.mk=function(){const er=m=>$("#er").textContent=m;
if(!n.value||!cat.value||!v.value||!ci.value||!dt.value)return er("All fields are required");if(dt.value<new Date().toISOString().slice(0,10))return er("Date cannot be in the past");if(!(+cp.value>0))return er("Capacity must be positive");if(pr.value===""||+pr.value<0)return er("Price cannot be negative");
saveData("events",[...getData("events"),{id:Date.now(),name:n.value,category:cat.value,desc:d.value,date:dt.value,venue:v.value,city:ci.value,capacity:+cp.value,price:+pr.value,registered:0,emoji:"🎉",mode:["Wedding","Birthday","Engagement","Baby Shower","Housewarming","Reunion"].includes(cat.value)?"personal":"professional",online:ol.checked,organizer:me().name,time:"10:00 AM – 5:00 PM"}]);toast("Event created successfully");setTimeout(()=>location="events.html",900)}}
</script></body></html>
